name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start MongoDB replica set
        run: npm run db:up

      - name: Check Prisma transactions and shared schema
        run: npm run test:db

      - name: MongoDB diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 mongodb

      - name: Stop MongoDB
        if: always()
        run: npm run db:down
