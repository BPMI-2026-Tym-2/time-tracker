name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      DATABASE_URL: mongodb://127.0.0.1:27017/time_tracker?replicaSet=rs0&directConnection=true
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: Avg3SKjvUOC2bhNuSnLF5T2uReH0r2JXlP78Yqwo+eVxoG6Z6p+Re0dIYMjlxSCDGZaLRUE/IvpFtfEsaxKHhQ==
      CORS_ORIGIN: http://localhost:3000
      GOOGLE_CLIENT_ID: 117243450334-6e5520sju3fuu8lv6ig20c4jn579t0rv.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: GOCSPX--ci-dummy-client-secret-12345

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start MongoDB
        run: |
          echo "127.0.0.1 mongodb" | sudo tee -a /etc/hosts
          npm run db:up

      - name: Run tests
        run: npm test
